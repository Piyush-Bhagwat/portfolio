<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Google Fonts: Inter & JetBrains Mono -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
            rel="stylesheet"
        />
        <!-- FontAwesome -->
        <script
            src="https://kit.fontawesome.com/50889841b5.js"
            crossorigin="anonymous"
        ></script>
        <!-- Pre-hydration Theme Initializer (Zero-FOUC) -->
        <script>
            (function() {
                try {
                    var stored = localStorage.getItem('portfolio-theme');
                    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (stored === 'dark' || (!stored && prefersDark)) {
                        document.documentElement.classList.add('dark');
                        document.documentElement.classList.remove('light');
                    } else if (stored === 'light' || (!stored && !prefersDark)) {
                        document.documentElement.classList.remove('dark');
                        document.documentElement.classList.add('light');
                    }
                } catch (e) {}
            })();
        </script>
        <title>Piyush Bhagwat | Portfolio</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
